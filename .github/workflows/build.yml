name: Build Screen9-16

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android32
          sdk: given

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: Screen9-16
          path: ${{ steps.build.outputs.build-output }}/*.geode